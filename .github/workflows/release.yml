name: Release

# Cut a release by pushing (or merging) to the `release` branch.
# Nothing on master triggers this — day-to-day commits stay release-free.
#
# The version in Cargo.toml is the single source of truth: it becomes the git
# tag `v<version>` that engine and site pin in their Cargo.toml. A tag is never
# moved, so bump `version` before merging into `release` again.
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — bump version in Cargo.toml"
            exit 1
          fi

      # engine and site build blueprint with these features.
      - name: Build and test
        run: |
          cargo build --locked --all-features
          cargo test --locked --all-features

      - name: Create GitHub Release (tags the commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: learnmedi_blueprint v${{ steps.ver.outputs.version }}
          generate_release_notes: true
