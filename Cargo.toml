[package]
name = "learnmedi_blueprint"
version = "0.3.0"
edition = "2024"
description = "Shared data types and validation for Learnmedi"

[features]
default = ["actix"]
actix = ["dep:actix-web", "dep:tracing"]
mongodb = ["dep:mongodb"]
reqwest = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = { version = "2", features = ["chrono-0_4"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
actix-web = { version = "4.9", default-features = false, features = ["macros", "cookies"], optional = true }
tracing = { version = "0.1", optional = true }
mongodb = { version = "3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_yaml_ng = "0.10.0"
