key: hero
label: Trang bìa
group: present
interactive: false
description: 'Bìa hoặc mở đầu: tiêu đề lớn (title), phụ đề, dòng thông tin và tới 4 con số chạy.'
fields:
- type: markdown
  max: 600
  key: subtitle
  label: Phụ đề
  default: ''
- type: text
  max: 200
  key: meta
  label: Dòng thông tin (ngày, đơn vị…)
  default: ''
- type: list
  max: 4
  item:
  - type: text
    max: 24
    key: value
    label: Giá trị
    default: '0'
    required: true
  - type: text
    max: 120
    key: label
    label: Nhãn
    default: ''
  key: stats
  label: Con số nổi bật (số đếm chạy)
  default: []
- type: select
  options:
  - left
  - center
  - split
  key: layout
  label: Bố cục
  default: left
- type: image
  key: image
  label: Ảnh (bố cục split)
  default: ''
example:
  id: cover
  kind: hero
  eyebrow: Hội thảo nội bộ · Học kỳ I
  title: Kế hoạch thư viện số
  subtitle: Mục tiêu, nguồn lực và các việc cần chốt
  stats:
  - value: '3'
    label: mục tiêu chính
  - value: '5'
    label: việc cần quyết định
