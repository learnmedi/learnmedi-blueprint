key: quote
label: Trích dẫn
group: present
interactive: false
description: Trích nguyên văn một văn bản, có nguồn.
fields:
- type: markdown
  max: 1200
  key: quote
  label: Trích dẫn
  default: ''
  required: true
- type: text
  max: 200
  key: cite
  label: Người/văn bản
  default: ''
- type: text
  max: 200
  key: ref
  label: Vị trí (mục, trang)
  default: ''
- type: select
  options:
  - default
  - primary
  - accent
  - good
  - warn
  - bad
  - muted
  key: tone
  label: Sắc thái (màu nhấn)
  default: default
