key: media_text
group: presentation
label: Ảnh + chữ
description: Hiển thị tiêu đề, nội dung, trích dẫn, nút và tối đa ba ảnh. Có thể đặt ảnh bên trái hoặc bên
  phải.
fields:
- type: text
  max: 80
  key: eyebrow
  label: Dòng nhỏ
  default: ''
- type: text
  max: 200
  emphasis: true
  key: title
  label: Tiêu đề
  required: true
  default: Câu chuyện của tôi
- type: markdown
  max: 5000
  key: body
  label: Nội dung
  default: ''
- type: text
  max: 400
  key: quote
  label: Câu trích
  default: ''
- type: text
  max: 120
  key: quote_author
  label: Ký tên câu trích
  default: ''
- type: list
  max: 3
  item:
  - type: image
    key: image
    label: Ảnh
    required: true
    default: ''
  - type: text
    max: 200
    key: alt
    label: Mô tả ảnh (cho người khiếm thị/SEO)
    default: ''
  - type: text
    max: 200
    key: caption
    label: Chú thích
    default: ''
  key: images
  label: Ảnh (1–3)
  default: []
- type: select
  options:
  - left
  - right
  key: image_side
  label: Ảnh nằm bên
  default: left
- type: list
  max: 3
  item:
  - type: text
    max: 60
    key: label
    label: Chữ trên nút
    required: true
    default: Xem thêm
  - type: url
    key: url
    label: Liên kết
    required: true
    default: '#'
  - type: select
    options:
    - primary
    - secondary
    - ghost
    key: variant
    label: Kiểu
    default: primary
  - type: bool
    key: new_tab
    label: Mở tab mới
    default: false
  key: buttons
  label: Nút
  default: []
