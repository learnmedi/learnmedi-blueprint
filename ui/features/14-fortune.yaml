key: site.fortune
label: Lịch bloc mỗi ngày
description: Cuốn lịch xé nhỏ ở góc mọi trang công khai; xé tờ hôm nay để đọc một câu của bộ chủ site chọn (Truyện Kiều, Kinh Dịch, Thích Nhất Hạnh).
workspace: settings
default_tier: basic
default_enabled: true
locked: true
surfaces:
  blocks: []
  widgets: [fortune_button]
routes:
  public: []
  staff: []
reserved_slugs: []
tools:
  - name: set_fortune
prompt: |
  - Lịch bloc mỗi ngày: cuốn lịch xé ở góc site; mỗi khách xé một tờ mỗi ngày và đọc một câu của bộ chủ site chọn. Bật/tắt hoặc đổi bộ (kieu = Truyện Kiều, kinh_dich = Kinh Dịch, thich_nhat_hanh = Thích Nhất Hạnh) → set_fortune. Câu do hệ thống chọn, không viết câu.
