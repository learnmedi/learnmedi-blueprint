<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiếp thu Thông báo 579/TB-VPCP</title><style>/* Learnmedi deck player. One 1600×900 stage scaled to the window; every colour,
   font and motion level comes from the deck theme (CSS variables set by player.js). */
:root {
  --primary: #12305a; --accent: #b0812b; --bg: #f4f6f9; --surface: #fff; --ink: #0f1b2d; --muted: #5a6577;
  --good: #1d7a4e; --warn: #b26b00; --bad: #b42318;
  --hf: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --bf: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --fs: 1; --line: color-mix(in srgb, var(--ink) 12%, transparent); --soft: color-mix(in srgb, var(--primary) 6%, var(--surface));
  --r: 14px; --dur: 420ms; --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
body { font-family: var(--bf); color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea, select { font: inherit; color: var(--ink); }

#deck-app { position: fixed; inset: 0; display: flex; flex-direction: column; background: color-mix(in srgb, var(--ink) 92%, #000); }
.dk-viewport { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.dk-stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center center; background: var(--bg); overflow: hidden; border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.dk-slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 88px 70px; font-size: calc(26px * var(--fs)); line-height: 1.45; }
.dk-slide.bg-tint { background: var(--soft); }
.dk-slide.bg-dark { background: color-mix(in srgb, var(--primary) 82%, #000); color: #fff; --ink: #fff; --muted: rgba(255,255,255,.72); --line: rgba(255,255,255,.18); --surface: rgba(255,255,255,.06); --soft: rgba(255,255,255,.08); }
.dk-slide.bg-primary { background: var(--primary); color: #fff; --ink: #fff; --muted: rgba(255,255,255,.78); --line: rgba(255,255,255,.22); --surface: rgba(255,255,255,.08); --soft: rgba(255,255,255,.1); }
.dk-slide.bg-image { background-size: cover; background-position: center; color: #fff; --ink: #fff; --muted: rgba(255,255,255,.8); }
.dk-slide.bg-image::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,10,20,.82), rgba(5,10,20,.35)); }
.dk-slide.bg-image > * { position: relative; }

/* Accent rail */
.dk-slide::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--tone, var(--primary)); opacity: .9; }
.dk-slide.k-hero::after, .dk-slide.k-section::after { display: none; }

/* Header */
.dk-head { margin-bottom: 30px; max-width: 1340px; }
.dk-eyebrow { font-size: .62em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
.dk-eyebrow .code { background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 6px; letter-spacing: .06em; }
.dk-title { font-family: var(--hf); font-weight: 700; font-size: 1.72em; line-height: 1.16; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.dk-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; }
.dk-foot { position: absolute; left: 88px; right: 88px; bottom: 24px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); gap: 20px; }
.dk-foot .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dk-foot .pg { font-variant-numeric: tabular-nums; }
.dk-logo { position: absolute; right: 88px; top: 40px; height: 44px; }
.intro { color: var(--muted); font-size: .86em; max-width: 1300px; }
.md p { margin: 0 0 .5em; } .md p:last-child { margin-bottom: 0; } .md ul, .md ol { margin: .2em 0; padding-left: 1.2em; } .md a { color: var(--accent); }
.md strong { font-weight: 700; } .md code { background: var(--soft); padding: 1px 6px; border-radius: 5px; font-size: .9em; }

/* Tones */
.t-default { --tone: var(--primary); } .t-primary { --tone: var(--primary); } .t-accent { --tone: var(--accent); }
.t-good { --tone: var(--good); } .t-warn { --tone: var(--warn); } .t-bad { --tone: var(--bad); } .t-muted { --tone: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .64em; font-weight: 700; background: color-mix(in srgb, var(--tone, var(--primary)) 13%, transparent); color: var(--tone, var(--primary)); white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }

/* Hero */
.k-hero { justify-content: center; padding: 90px 110px; background: linear-gradient(135deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 70%, #000) 100%); color: #fff; --ink: #fff; --muted: rgba(255,255,255,.76); --line: rgba(255,255,255,.2); }
.k-hero .dk-eyebrow { color: color-mix(in srgb, var(--accent) 70%, #fff); }
.k-hero .dk-title { font-size: 2.7em; max-width: 1250px; }
.k-hero .sub { font-size: 1.05em; color: var(--muted); margin-top: 22px; max-width: 1150px; }
.k-hero .meta { margin-top: 26px; font-size: .7em; color: var(--muted); letter-spacing: .03em; }
.k-hero .hero-stats { display: flex; gap: 22px; margin-top: 64px; }
.k-hero .hero-stat { min-width: 220px; padding: 22px 28px; border-left: 3px solid var(--accent); background: rgba(255,255,255,.06); border-radius: 0 12px 12px 0; }
.k-hero .hero-stat b { display: block; font-family: var(--hf); font-size: 2.4em; line-height: 1; font-variant-numeric: tabular-nums; }
.k-hero .hero-stat span { font-size: .62em; color: var(--muted); }
.k-hero.lay-center { align-items: center; text-align: center; } .k-hero.lay-center .hero-stats { justify-content: center; }
.k-hero .deco { position: absolute; right: -160px; top: -160px; width: 720px; height: 720px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); }
.k-hero .deco::before { content: ""; position: absolute; inset: 90px; border-radius: 50%; border: 1px solid rgba(255,255,255,.07); }
.k-hero .deco::after { content: ""; position: absolute; inset: 200px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%); }
.k-hero.lay-split { flex-direction: row; align-items: center; gap: 60px; }
.k-hero .hero-img { width: 560px; height: 640px; object-fit: cover; border-radius: 16px; }

/* Section */
.k-section { justify-content: center; background: color-mix(in srgb, var(--primary) 88%, #000); color: #fff; --ink: #fff; --muted: rgba(255,255,255,.72); }
.k-section .num { font-family: var(--hf); font-size: 6em; font-weight: 700; line-height: 1; color: color-mix(in srgb, var(--accent) 80%, #fff); opacity: .95; }
.k-section .dk-title { font-size: 2.3em; margin-top: 18px; }
.k-section .sub { color: var(--muted); margin-top: 18px; font-size: 1em; max-width: 1100px; }

/* Stats */
.stat-grid { display: grid; gap: 22px; grid-template-columns: repeat(var(--cols, 3), 1fr); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 30px; border-top: 4px solid var(--tone, var(--primary)); }
.stat b { display: block; font-family: var(--hf); font-size: 2.6em; line-height: 1.05; color: var(--tone, var(--primary)); font-variant-numeric: tabular-nums; }
.stat .lbl { font-weight: 600; margin-top: 8px; font-size: .86em; }
.stat .note { color: var(--muted); font-size: .66em; margin-top: 6px; }

/* Bullets */
.bl { display: flex; flex-direction: column; gap: 18px; margin: 0; padding: 0; list-style: none; }
.bl li { display: flex; gap: 20px; align-items: flex-start; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.bl li .mk { flex: none; width: 14px; height: 14px; margin-top: .5em; border-radius: 3px; background: var(--tone, var(--accent)); }
.bl.numbered li .mk { width: 46px; height: 46px; margin-top: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .8em; background: var(--tone, var(--primary)); }
.bl li .sub { color: var(--muted); font-size: .8em; margin-top: 4px; }
.bl li.hidden-step { opacity: 0; transform: translateY(14px); }
.bl li.past-step { opacity: .55; }
.bl.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.bl.cards li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 26px; }
.bl.two_col { display: grid; grid-template-columns: 1fr 1fr; column-gap: 60px; }

/* Agenda */
.agenda { display: flex; flex-direction: column; gap: 10px; }
.ag-row { display: grid; grid-template-columns: 120px 1fr 140px; align-items: center; gap: 26px; padding: 18px 26px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; }
.ag-row.cur { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.ag-row .tm { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--primary); }
.ag-row .ttl { font-weight: 650; }
.ag-row .out { color: var(--muted); font-size: .72em; margin-top: 2px; }
.ag-row .min { justify-self: end; color: var(--muted); font-size: .76em; }
.ag-bar { height: 10px; border-radius: 99px; overflow: hidden; display: flex; background: var(--line); margin-top: 8px; }
.ag-bar i { display: block; height: 100%; }
button.ag-row:hover, .goto:hover { border-color: var(--accent); }

/* Cards */
.cards { display: grid; gap: 20px; grid-template-columns: repeat(var(--cols, 3), 1fr); align-items: stretch; }
.card { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--tone, var(--line)); transition: transform .25s var(--ease), box-shadow .25s; }
.card.hl { border: 2px solid var(--tone, var(--accent)); box-shadow: 0 12px 36px color-mix(in srgb, var(--tone, var(--accent)) 22%, transparent); }
.card .kick { font-size: .6em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tone, var(--accent)); }
.card .ttl { font-family: var(--hf); font-weight: 700; font-size: 1em; line-height: 1.25; }
.card .bd { color: var(--muted); font-size: .76em; }
.card .tag { position: absolute; right: 18px; top: 18px; }
.card.expandable .bd { display: none; } .card.expandable.open .bd { display: block; }
.card.clickable { cursor: pointer; } .card.clickable:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.card .more { font-size: .6em; color: var(--accent); font-weight: 700; margin-top: auto; }

/* Compare */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; min-height: 0; }
.cmp-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 32px; border-top: 5px solid var(--tone, var(--primary)); overflow: auto; }
.cmp-col h3 { margin: 0 0 14px; font-family: var(--hf); font-size: .9em; color: var(--tone, var(--primary)); text-transform: uppercase; letter-spacing: .06em; }
.cmp-col .md { font-size: .86em; }
.verdict { display: flex; gap: 16px; align-items: flex-start; padding: 20px 26px; background: var(--soft); border-radius: var(--r); font-weight: 600; font-size: .86em; }
.verdict::before { content: "→"; color: var(--accent); font-weight: 800; }

/* Quote */
.k-quote .dk-body { justify-content: center; }
.qt { font-family: var(--hf); font-size: 1.5em; line-height: 1.35; max-width: 1300px; padding-left: 40px; border-left: 6px solid var(--tone, var(--accent)); }
.qt-cite { margin-top: 24px; padding-left: 46px; color: var(--muted); font-size: .76em; }

/* Chart */
.chart { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 26px; padding: 10px 10px 0; border-bottom: 2px solid var(--line); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 10px; }
.bar i { display: block; width: 100%; max-width: 140px; background: var(--tone, var(--primary)); border-radius: 8px 8px 0 0; height: 0; transition: height 900ms var(--ease); }
.bar b { font-variant-numeric: tabular-nums; }
.bar-lbls { display: flex; gap: 26px; padding: 12px 10px 0; } .bar-lbls span { flex: 1; text-align: center; font-size: .66em; color: var(--muted); }
.hbars { display: flex; flex-direction: column; gap: 16px; }
.hbar { display: grid; grid-template-columns: 320px 1fr 120px; gap: 18px; align-items: center; font-size: .8em; }
.hbar .track { height: 26px; background: var(--line); border-radius: 99px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; width: 0; background: var(--tone, var(--primary)); border-radius: 99px; transition: width 900ms var(--ease); }
.hbar b { text-align: right; font-variant-numeric: tabular-nums; }
.donut-wrap { display: flex; align-items: center; gap: 70px; flex: 1; }
.donut-wrap svg { width: 460px; height: 460px; transform: rotate(-90deg); }
.donut-wrap circle { fill: none; stroke-width: 54; transition: stroke-dasharray 900ms var(--ease); }
.legend { display: flex; flex-direction: column; gap: 14px; font-size: .86em; }
.legend div { display: flex; gap: 14px; align-items: center; } .legend i { width: 18px; height: 18px; border-radius: 4px; background: var(--tone); }
.legend b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 30px; }
.donut-center { position: relative; } .donut-center .tot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--hf); font-size: 2.6em; font-weight: 700; }
.donut-center .tot small { display: block; font-size: .3em; color: var(--muted); font-weight: 500; }
.line-svg { flex: 1; width: 100%; }

/* Timeline */
.tl-count { display: flex; align-items: baseline; gap: 18px; margin-bottom: 4px; }
.tl-count b { font-family: var(--hf); font-size: 2.4em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.tl-count span { color: var(--muted); font-size: .8em; }
.timeline { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 18px; padding-top: 34px; flex: 1; min-height: 0; }
.timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 3px; background: var(--line); }
.timeline .prog { position: absolute; left: 0; top: 14px; height: 3px; background: var(--accent); width: 0; transition: width 1.2s var(--ease); }
.tl-item { position: relative; display: flex; flex-direction: column; gap: 8px; }
.tl-item::before { content: ""; position: absolute; top: -27px; left: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
.tl-item.done::before { background: var(--primary); }
.tl-item.now::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); }
.tl-item .d { font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.tl-item .t { font-weight: 600; font-size: .82em; line-height: 1.3; }
.tl-item .b { color: var(--muted); font-size: .66em; }
.tl-item input { margin-top: auto; width: 100%; font-size: .62em; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--soft); }
.tl-item input:focus { outline: 2px solid var(--accent); border-color: transparent; }

/* Tables */
.tbl-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.flt { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: .62em; font-weight: 600; background: var(--surface); }
.flt.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.flt .n { opacity: .7; margin-left: 6px; font-variant-numeric: tabular-nums; }
.tbl-search { margin-left: auto; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: .62em; width: 280px; background: var(--surface); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .66em; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tbl th { text-align: left; font-size: .86em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 18px; background: var(--soft); font-weight: 700; }
.tbl td { padding: 14px 18px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr.row { cursor: pointer; transition: background .15s; } .tbl tr.row:hover td { background: var(--soft); }
.tbl tr.sel td { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.tbl .w-s { width: 13%; } .tbl .w-l { width: 42%; }
.goto { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: .92em; background: var(--surface); color: var(--primary); }
.pager { display: flex; gap: 8px; justify-content: flex-end; font-size: .6em; color: var(--muted); align-items: center; }
.pager button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; background: var(--surface); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 640px; background: var(--surface); box-shadow: -20px 0 60px rgba(0,0,0,.18); padding: 56px 50px; display: flex; flex-direction: column; gap: 18px; overflow: auto; z-index: 5; transform: translateX(105%); transition: transform .35s var(--ease); color: var(--ink); }
.drawer.open { transform: none; }
.drawer h3 { margin: 0; font-family: var(--hf); font-size: 1.1em; }
.drawer .x { position: absolute; right: 22px; top: 18px; font-size: 1.2em; color: var(--muted); }
.drawer .fld { font-size: .56em; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.drawer .val { font-size: .76em; margin-top: 4px; }

/* Matrix */
.matrix { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 20px; flex: 1; min-height: 0; }
.mx-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; }
.mx-head { padding: 20px 24px; border-bottom: 4px solid var(--tone, var(--primary)); display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; }
.mx-head b { font-family: var(--hf); font-size: 2em; color: var(--tone, var(--primary)); font-variant-numeric: tabular-nums; line-height: 1; }
.mx-head span { font-weight: 700; font-size: .74em; }
.mx-cells { padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.mx-cell { text-align: left; padding: 12px 16px; border-radius: 10px; background: color-mix(in srgb, var(--tone, var(--primary)) 9%, var(--surface)); font-size: .66em; font-weight: 600; border-left: 4px solid var(--tone, var(--primary)); transition: transform .2s var(--ease); }
.mx-cell:hover { transform: translateX(4px); }
.mx-cell.pop { animation: pop .5s var(--ease) both; }

/* Decision */
.k-decision .dk-body { flex-direction: row; gap: 34px; }
.dec-main { flex: 1.35; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.dec-side { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dec-q { font-size: .86em; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { display: grid; grid-template-columns: 54px 1fr; gap: 18px; align-items: start; text-align: left; padding: 18px 22px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--line); transition: border-color .2s, background .2s, transform .2s var(--ease), opacity .2s; }
.opt:hover { border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
.opt .key { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-family: var(--hf); background: var(--soft); color: var(--primary); font-size: .9em; }
.opt .tx { font-weight: 600; font-size: .84em; } .opt .nt { color: var(--muted); font-size: .66em; margin-top: 4px; font-weight: 400; }
.opt.chosen { border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.opt.chosen .key { background: var(--good); color: #fff; }
.opts.has-choice .opt:not(.chosen) { opacity: .55; }
.opt .badge { justify-self: start; margin-top: 8px; }
.hint { padding: 16px 20px; border-radius: var(--r); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px dashed var(--accent); font-size: .7em; }
.hint b { color: var(--accent); display: block; font-size: .8em; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 22px; }
.box h4 { margin: 0 0 10px; font-size: .58em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.box ul { margin: 0; padding-left: 1.1em; font-size: .66em; } .box li { margin: 4px 0; }
.status-row { display: flex; gap: 8px; flex-wrap: wrap; }
.st-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: .58em; font-weight: 700; background: var(--surface); }
.st-btn.on { color: #fff; background: var(--tone); border-color: var(--tone); }
.concl { width: 100%; min-height: 96px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: .64em; background: var(--soft); }
.concl:focus, .note-area:focus { outline: 2px solid var(--accent); }
.refs { display: flex; gap: 8px; flex-wrap: wrap; }
.ref { font-size: .56em; padding: 4px 10px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); }
.mini-tbl { width: 100%; border-collapse: collapse; font-size: .6em; }
.mini-tbl th { text-align: left; color: var(--muted); font-size: .9em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.mini-tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.mini-tbl select { font-size: 1em; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); max-width: 220px; }

/* Assign */
.assign { width: 100%; border-collapse: separate; border-spacing: 0 10px; font-size: .72em; }
.assign th { text-align: left; color: var(--muted); font-size: .8em; letter-spacing: .08em; text-transform: uppercase; padding: 0 16px; }
.assign td { background: var(--surface); padding: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: middle; }
.assign td:first-child { border-left: 1px solid var(--line); border-radius: 12px 0 0 12px; font-weight: 700; }
.assign td:last-child { border-right: 1px solid var(--line); border-radius: 0 12px 12px 0; }
.assign .dt { color: var(--muted); font-weight: 400; font-size: .86em; margin-top: 3px; }
.assign select, .assign input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: .95em; }
.assign select.set, .assign input.set { border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }

/* Poll, rank, checklist, note */
.poll { display: flex; flex-direction: column; gap: 14px; }
.poll-opt { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 18px 24px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--line); overflow: hidden; }
.poll-opt .fill { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--primary) 12%, transparent); width: 0; transition: width .6s var(--ease); }
.poll-opt > span, .poll-opt > b { position: relative; } .poll-opt b { font-variant-numeric: tabular-nums; }
.poll-opt.mine { border-color: var(--primary); }
.poll-opt .pn { display: block; font-size: .7em; color: var(--muted); }
.poll-ctl { display: flex; gap: 8px; } .poll-ctl button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; position: relative; }
.rank { display: flex; flex-direction: column; gap: 10px; }
.rank-item { display: grid; grid-template-columns: 50px 1fr auto; gap: 16px; align-items: center; padding: 14px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: grab; transition: transform .25s var(--ease); }
.rank-item .no { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; }
.rank-item .mv button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.rank-item.drag { opacity: .4; }
.check { display: flex; flex-direction: column; gap: 12px; }
.check-item { display: flex; gap: 18px; align-items: center; text-align: left; padding: 14px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.check-item .bx { width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; font-weight: 900; flex: none; }
.check-item.on .bx { background: var(--good); border-color: var(--good); }
.check-item.on .lbl { text-decoration: line-through; color: var(--muted); }
.note-area { width: 100%; flex: 1; resize: none; padding: 20px 24px; border-radius: var(--r); border: 1px solid var(--line); font-size: .8em; background: var(--surface); line-height: 1.5; }

/* Summary */
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; overflow: auto; flex: 1; min-height: 0; align-content: start; }
.sum-item { display: grid; grid-template-columns: 70px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .66em; }
.sum-item .cd { font-weight: 800; color: var(--accent); font-family: var(--hf); }
.sum-item .tt { font-weight: 700; } .sum-item .ch { margin-top: 4px; } .sum-item .ch.none { color: var(--muted); font-style: italic; }
.sum-item .nt { color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
.sum-actions { display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: .62em; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.sum-sign { display: flex; justify-content: space-around; margin-top: 10px; font-size: .62em; color: var(--muted); text-align: center; }
.sum-sign div { min-width: 260px; } .sum-sign b { display: block; color: var(--ink); margin-bottom: 70px; }

/* Learn kinds */
.quiz-q { font-weight: 650; font-size: .96em; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.qo { text-align: left; padding: 18px 22px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--line); font-size: .8em; font-weight: 600; }
.qo.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.qo.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.explain { padding: 14px 20px; border-radius: var(--r); background: var(--soft); font-size: .72em; }
.qnav { display: flex; gap: 8px; align-items: center; font-size: .62em; color: var(--muted); }
.qnav .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); } .qnav .dot.cur { background: var(--primary); } .qnav .dot.ok { background: var(--good); } .qnav .dot.ko { background: var(--bad); }
.timer { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
.cls { display: grid; grid-template-columns: 1fr 1.2fr; gap: 26px; flex: 1; min-height: 0; }
.cls-items { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.cls-item { padding: 14px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .7em; }
.cls-item .bks { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.cls-item .bks button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: .9em; background: var(--soft); }
.cls-item.ok { border-color: var(--good); } .cls-item.ko { border-color: var(--bad); }
.cls-item .why { color: var(--muted); font-size: .92em; margin-top: 8px; }
.cls-buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-content: start; }
.bucket { background: var(--soft); border-radius: var(--r); padding: 16px; min-height: 150px; }
.bucket h4 { margin: 0 0 10px; font-size: .66em; } .bucket div { font-size: .56em; padding: 6px 10px; background: var(--surface); border-radius: 8px; margin-bottom: 6px; }
.reveal { display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 24px; text-align: left; width: 100%; }
.rv .q { font-weight: 650; font-size: .82em; } .rv .a { display: none; margin-top: 10px; color: var(--muted); font-size: .74em; border-top: 1px dashed var(--line); padding-top: 10px; }
.rv.open .a { display: block; } .rv .more { font-size: .58em; color: var(--accent); font-weight: 700; margin-top: 8px; }
.flash { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; overflow: auto; }
.fc { perspective: 1000px; height: 210px; }
.fc-in { position: relative; width: 100%; height: 100%; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.fc.on .fc-in { transform: rotateY(180deg); }
.fc-f, .fc-b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r); padding: 22px; display: grid; place-items: center; text-align: center; border: 1px solid var(--line); background: var(--surface); font-size: .74em; }
.fc-f { font-weight: 700; font-family: var(--hf); font-size: .9em; } .fc-b { transform: rotateY(180deg); background: var(--soft); }
.img-full { flex: 1; min-height: 0; width: 100%; border-radius: var(--r); } .img-cap { color: var(--muted); font-size: .72em; }

/* Chrome */
.dk-bar { flex: none; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; color: rgba(255,255,255,.86); font-size: 14px; background: rgba(8,12,22,.94); border-top: 1px solid rgba(255,255,255,.06); z-index: 20; }
.dk-bar .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
.dk-bar .seg { color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dk-bar .sp { flex: 1; }
.dk-bar button { height: 34px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,.07); color: #fff; font-size: 13px; white-space: nowrap; }
.dk-bar button:hover { background: rgba(255,255,255,.15); }
.dk-bar button.on { background: var(--accent); }
.dk-bar .pg { font-variant-numeric: tabular-nums; color: rgba(255,255,255,.7); min-width: 64px; text-align: center; }
.dk-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); z-index: 21; }
.dk-progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s var(--ease); }
.live-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); font-weight: 700; font-size: 12px; }
.live-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,.6); animation: pulse 1.6s infinite; }
.live-pill.away::before { background: #f59e0b; animation: none; } .live-pill.ended::before { background: #94a3b8; animation: none; }
.follow { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; display: flex; gap: 10px; align-items: center; padding: 8px 10px 8px 16px; border-radius: 999px; background: rgba(8,12,22,.9); color: #fff; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.follow button { padding: 6px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; }
.follow.following button { background: rgba(255,255,255,.12); }

/* Presenter panel */
.dk-main { flex: 1; min-height: 0; display: flex; }
.dk-panel { width: 400px; flex: none; background: #0f1626; color: #e5e9f0; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,.06); font-size: 14px; }
.dk-panel[hidden] { display: none; }
.pn-clock { padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
.pn-clock .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.pn-clock .row { display: flex; justify-content: space-between; gap: 10px; color: #9aa6b8; margin-top: 4px; }
.pn-clock .late { color: #f87171; } .pn-clock .ok { color: #4ade80; }
.pn-segs { padding: 10px 18px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 6px; }
.pn-seg { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; color: #9aa6b8; }
.pn-seg.cur { color: #fff; font-weight: 700; }
.pn-seg .mt { height: 4px; grid-column: 1 / -1; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.pn-seg .mt i { display: block; height: 100%; background: #60a5fa; } .pn-seg .mt i.over { background: #f87171; }
.pn-notes { flex: 1; overflow: auto; padding: 16px 18px; line-height: 1.55; font-size: 15px; }
.pn-notes h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7c8aa0; }
.pn-next { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.06); color: #9aa6b8; }
.pn-next b { color: #fff; display: block; margin-top: 2px; }

/* Grid overview */
.dk-grid { position: fixed; inset: 0; z-index: 50; background: rgba(6,10,18,.96); overflow: auto; padding: 30px 40px 60px; color: #fff; }
.dk-grid h2 { margin: 0 0 18px; font-size: 18px; }
.dk-grid .grp { margin: 20px 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; }
.dk-grid .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.dk-grid .tile { text-align: left; padding: 14px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); min-height: 92px; display: flex; flex-direction: column; gap: 6px; color: #fff; }
.dk-grid .tile.cur { border-color: var(--accent); background: rgba(255,255,255,.1); }
.dk-grid .tile small { color: #94a3b8; font-size: 11px; } .dk-grid .tile b { font-size: 14px; line-height: 1.3; }
.dk-grid .tile .done { color: #4ade80; font-size: 11px; }
.dk-grid .close { position: fixed; right: 24px; top: 18px; font-size: 26px; color: #fff; }

/* Modal / toast */
.dk-modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.55); }
.dk-modal > div { background: #fff; color: #0f1b2d; border-radius: 14px; padding: 26px 28px; width: min(560px, 92vw); font-size: 15px; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.dk-modal h3 { margin: 0 0 10px; } .dk-modal p { color: #475569; margin: 8px 0; }
.dk-modal .url { display: flex; gap: 8px; margin: 14px 0; } .dk-modal .url input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
.dk-modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 16px; }
.dk-modal button { padding: 9px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 700; font-size: 14px; background: #fff; }
.dk-modal button.primary { background: #12305a; color: #fff; border-color: #12305a; }
.dk-modal button.danger { color: #b42318; border-color: #f2c4c0; }
.dk-modal select { padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
.dk-modal .qr { display: grid; place-items: center; margin: 10px 0; } .dk-modal .qr svg { width: 200px; height: 200px; }
.dk-toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 70; padding: 10px 16px; border-radius: 10px; background: #0f172a; color: #fff; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.dk-black { position: fixed; inset: 0; background: #000; z-index: 45; }
.dk-loading { color: #cbd5e1; font-size: 15px; margin: auto; text-align: center; }

/* Motion */
.enter-next { animation: inNext var(--dur) var(--ease) both; }
.enter-prev { animation: inPrev var(--dur) var(--ease) both; }
.stagger > * { animation: rise var(--dur) var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: 60ms; } .stagger > *:nth-child(3) { animation-delay: 120ms; } .stagger > *:nth-child(4) { animation-delay: 180ms; }
.stagger > *:nth-child(5) { animation-delay: 240ms; } .stagger > *:nth-child(6) { animation-delay: 300ms; } .stagger > *:nth-child(n+7) { animation-delay: 340ms; }
.motion-none .enter-next, .motion-none .enter-prev, .motion-none .stagger > *, .motion-none .mx-cell.pop { animation: none !important; }
.motion-none * { transition: none !important; }
.motion-lively { --dur: 560ms; }
@keyframes inNext { from { opacity: 0; transform: translateX(46px); } to { opacity: 1; transform: none; } }
@keyframes inPrev { from { opacity: 0; transform: translateX(-46px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.94); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); } 70% { box-shadow: 0 0 0 9px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
@media (prefers-reduced-motion: reduce) { .enter-next, .enter-prev, .stagger > *, .mx-cell.pop { animation: none !important; } }

/* Small screens (viewers on phones): the stage still scales; chrome compacts. */
@media (max-width: 720px) {
  .dk-bar { gap: 6px; padding: 0 8px; } .dk-bar .seg, .dk-bar .opt-wide { display: none; } .dk-bar .t { max-width: 40vw; }
  .dk-panel { position: fixed; inset: auto 0 52px 0; width: auto; height: 45vh; z-index: 30; }
}

/* Print: the minutes (summary) or every slide as a page. */
@media print {
  @page { size: 1600px 900px; margin: 0; }
  html, body { overflow: visible; background: #fff; height: auto; }
  #deck-app { position: static; display: block; background: #fff; }
  .dk-bar, .dk-panel, .follow, .dk-progress, .dk-toast { display: none !important; }
  .dk-viewport { display: block; overflow: visible; }
  .dk-stage { position: relative; left: 0; top: 0; transform: none !important; box-shadow: none; border-radius: 0; page-break-after: always; }
  .drawer { display: none; }
}

/* QR card (on the slide; movable by the presenter) */
.dk-qr { position: absolute; z-index: 8; background: #fff; color: #0f1b2d; border-radius: 18px; padding: 16px 16px 12px; box-shadow: 0 18px 50px rgba(0,0,0,.28); display: flex; flex-direction: column; align-items: center; gap: 8px; animation: pop .4s var(--ease) both; }
.dk-qr img { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; pointer-events: none; }
.dk-qr .qr-cap { text-align: center; line-height: 1.25; } .dk-qr .qr-cap b { display: block; font-size: 20px; } .dk-qr .qr-cap span { font-size: 13px; color: #5a6577; word-break: break-all; }
.dk-qr.movable { cursor: grab; touch-action: none; } .dk-qr.movable:active { cursor: grabbing; }
.dk-qr .qr-tools { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); display: none; gap: 4px; background: rgba(8,12,22,.92); padding: 6px; border-radius: 10px; white-space: nowrap; }
.dk-qr.movable:hover .qr-tools { display: flex; }
.dk-qr .qr-tools button { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.1); color: #fff; font-size: 16px; }

/* Phones: slides reflow into a scrolling column instead of a tiny 16:9 box. */

body.dk-mobile .ag-row { grid-template-columns: 64px 1fr; padding: 12px 14px; gap: 12px; } body.dk-mobile .ag-row .min { grid-column: 2; justify-self: start; }
body.dk-mobile .k-decision .dk-body { flex-direction: column; gap: 16px; }

    setQr({ x: Math.max(0, Math.min(100 - w, px - (px > 50 ? w : px === 50 ? w / 2 : 0))), y: Math.max(0, Math.min(100 - hgt, py - (py > 50 ? hgt : py === 50 ? hgt / 2 : 0))) });
  }
  function setQr(patch, rerender = true) {
    S.ui._qr = { ...qrState(), ...patch, code: S.live && S.live.code };
    changed();
    if (rerender) render(false);
  }
  function toggleQr() {
    if (!PRESENTER()) return;
    if (!S.live || S.live.status === 'ended') { liveDialog(); return; }
    setQr({ on: !qrState().on });
  }

  // ───────────────────────── dialogs ─────────────────────────
  function modal(...kids) {
    const m = h('div', { class: 'dk-modal', onclick: (e) => { if (e.target === m) m.remove(); } }, h('div', null, ...kids));
    document.body.append(m);
    return m;
  }
  function liveDialog() {
    const active = S.live && S.live.status !== 'ended';
    if (!active) {
      const keep = h('select', null, h('option', { value: '0' }, 'đóng ngay khi kết thúc'), h('option', { value: '24' }, 'cho xem lại 1 ngày'), h('option', { value: '168' }, 'cho xem lại 7 ngày'));
      const m = modal(h('h3', null, 'Phát trực tiếp cho người xem'),
        h('p', null, 'Người có link xem trên máy của họ: tự đi theo slide và các lựa chọn của bạn, hoặc tự xem, tự bấm, rồi bấm “Về theo người trình bày”. Họ không thấy ghi chú, gợi ý và slide ẩn.'),
        h('p', null, 'Link hoạt động khi bạn đang trình chiếu. Chuyển cửa sổ hay tắt màn hình một lúc không làm dừng phiên; phiên tự kết thúc sau 30 phút không có tín hiệu từ trang này, sau 12 giờ, hoặc khi bạn bấm “Kết thúc”.'),
        h('p', null, 'Sau khi kết thúc: ', keep),
        h('div', { class: 'row' }, h('button', { onclick: () => m.remove() }, 'Huỷ'), h('button', { class: 'primary', onclick: async () => {
          try { S.live = await api('POST', '/api/decks/' + P.deck_id + '/live', { keep_hours: +keep.value }); m.remove(); startLiveLoop(); setQr({ on: true }); toast('Đang phát trực tiếp: mã QR đã hiện trên slide (kéo để di chuyển, Q để ẩn).'); } catch (e) { toast(e.message); }
        } }, 'Bắt đầu')));
      return;
    }
    const inp = h('input', { value: S.live.url, readonly: true, onclick: (e) => e.target.select() });
    const m = modal(h('h3', null, '● Đang phát trực tiếp'), h('div', { class: 'qr' }, h('img', { src: '/live/' + S.live.code + '/qr.svg', alt: 'QR', style: { width: '200px', height: '200px' } })), h('p', null, 'Người xem quét mã, hoặc mở link:'),
      h('div', { class: 'url' }, inp, h('button', { onclick: async () => { try { await navigator.clipboard.writeText(S.live.url); toast('Đã sao chép link'); } catch { inp.select(); } } }, 'Sao chép')),
      h('p', null, 'Mã phiên: ', h('b', null, S.live.code), S.live.keep_hours ? ' · cho xem lại ' + (S.live.keep_hours >= 168 ? '7 ngày' : '1 ngày') + ' sau khi kết thúc' : ' · link đóng khi kết thúc'),
      h('div', { class: 'row' }, h('button', { class: 'danger', onclick: async () => {
        if (!confirm('Kết thúc phiên trực tiếp?')) return;
        try { S.live = { ...S.live, ...(await api('POST', '/api/decks/live/' + S.live.code, { state: snapshot(), end: true })) }; m.remove(); renderBar(); toast('Đã kết thúc phiên'); saveResults(false); } catch (e) { toast(e.message); }
      } }, 'Kết thúc phiên'), h('button', { onclick: () => { setQr({ on: !qrState().on }); m.remove(); } }, qrState().on ? 'Ẩn QR trên slide' : 'Hiện QR trên slide'), h('button', { onclick: () => window.open(S.live.url, '_blank') }, 'Mở thử'), h('button', { class: 'primary', onclick: () => m.remove() }, 'Xong')));
  }
  function moreDialog() {
    const m = modal(h('h3', null, D.meta.title),
      h('div', { class: 'row', style: { justifyContent: 'flex-start' } },
        h('button', { onclick: () => { saveResults(true); } }, 'Lưu kết quả lên site'),
        h('button', { onclick: () => { if (confirm('Xoá mọi lựa chọn, ghi chú trên máy này?')) { S.results = {}; S.ui = {}; changed(); render(false); m.remove(); } } }, 'Xoá kết quả trên máy'),
        !BOOT.offline ? h('button', { onclick: () => { location.href = '/api/decks/' + P.deck_id + '/offline.html'; } }, 'Tải bản offline (.html)') : null,
        h('button', { onclick: () => download((D.meta.title || 'ket-qua') + '.json', JSON.stringify({ deck: P.deck_id, rev: P.rev, results: S.results }, null, 2)) }, 'Tải kết quả (.json)'),
        P.edit_path && !BOOT.offline ? h('button', { onclick: () => { location.href = P.edit_path; } }, 'Sửa deck') : null),
      h('p', null, 'Phím tắt: ← → chuyển · G mục lục · T ghi chú/đồng hồ · H gợi ý · Q mã QR · F toàn màn hình · B màn đen.'),
      h('div', { class: 'row' }, h('button', { class: 'primary', onclick: () => m.remove() }, 'Đóng')));
  }
  function openAudience() {
    const w = window.open(location.pathname + '?screen=audience', 'lmdeck-audience', 'width=1280,height=760');
    if (!w) toast('Trình duyệt chặn cửa sổ mới. Cho phép popup rồi thử lại.');
    else setTimeout(broadcast, 800);
  }
  function download(name, text) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })), download: name.replace(/[\\/:*?"<>|]+/g, '-') });
    document.body.append(a); a.click(); a.remove();
  }
  function fullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); setTimeout(fit, 200); }

  // ───────────────────────── keys ─────────────────────────
  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); detach(); next(); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); detach(); prev(); }
      else if (k === 'Home') { detach(); go(seq()[0], -1); }
      else if (k === 'End') { detach(); go(seq()[seq().length - 1], 1); }
      else if (k === 'g' || k === 'G') toggleGrid();
      else if ((k === 't' || k === 'T') && PRESENTER()) togglePanel();
      else if ((k === 'h' || k === 'H') && PRESENTER()) { S.hints = !S.hints; render(false); }
      else if ((k === 'q' || k === 'Q') && PRESENTER()) toggleQr();
      else if (k === 'f' || k === 'F') fullscreen();
      else if (k === 'b' || k === 'B' || k === '.') { S.black = !S.black; const b = $('.dk-black'); if (b) b.remove(); else document.body.append(h('div', { class: 'dk-black', onclick: () => $('.dk-black')?.remove() })); }
      else if (k === 'Escape') { if (S.grid) toggleGrid(); $('.dk-modal')?.remove(); }
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();
})();
</script></body></html>
