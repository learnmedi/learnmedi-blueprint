data:
  compare:
  - id: c1
    topic: Quan điểm
    req: Chiến lược là công cụ phục vụ trực tiếp đổi mới mô hình phát triển, theo NQ Đại hội và NQ 19-NQ/TW (28/7/2026)
    now: 5 quan điểm chung; chưa dẫn NQ 19-NQ/TW, chưa gắn với mô hình phát triển mới
    status: Chưa có
    fix: Viết lại quan điểm 1–2; bổ sung NQ 19-NQ/TW, NQ Đại hội vào căn cứ
    dec: d3
    tb: “Chiến lược phát triển nguồn nhân lực phải là công cụ quan trọng phục vụ trực tiếp việc đổi mới mô hình phát triển đất nước theo Nghị quyết Đại hội Đảng toàn quốc, Nghị quyết số 19-NQ/TW…” (mục 2, ý 1)
  - id: c2
    topic: Ngành ưu tiên
    req: Rà soát nghị quyết, chiến lược, quy hoạch ngành; xác định ngành, lĩnh vực ưu tiên theo từng giai đoạn
    now: Chưa có danh mục ngành, lĩnh vực ưu tiên
    status: Chưa có
    fix: Lập danh mục lĩnh vực chiến lược, ghi rõ nguồn nghị quyết hoặc quy hoạch
    dec: d1
    tb: “Xác định rõ các mục tiêu, định hướng, ngành, lĩnh vực ưu tiên phát triển của đất nước trong từng giai đoạn…” (mục 2, ý 1)
  - id: c3
    topic: Nhu cầu theo lĩnh vực
    req: Không cần chỉ tiêu cho mọi ngành; với lĩnh vực chiến lược phải có dự báo nhu cầu, nguồn lực, chỉ tiêu và nhiệm vụ theo giai đoạn
    now: 21 chỉ tiêu chung (Phụ lục I); không có dự báo theo lĩnh vực
    status: Một phần
    fix: Rút gọn chỉ tiêu chung; thêm phần nhu cầu nhân lực theo lĩnh vực chiến lược
    dec: d1
    tb: “Không nhất thiết phải đề ra các mục tiêu, chỉ tiêu về nhân lực cho tất cả các ngành, lĩnh vực nhưng phải làm rõ nhu cầu… đối với những ngành, lĩnh vực có ý nghĩa chiến lược” (mục 2, ý 2)
  - id: c4
    topic: Mốc thời gian
    req: Rà soát nghị quyết của Đảng để chọn và thống nhất mốc thời gian
    now: Chỉ có mốc 2030 và tầm nhìn 2050
    status: Cần quyết định
    fix: Chọn mốc (có thêm 2035 hoặc 2045 không) và cách gọi tên giai đoạn
    dec: d2
    tb: “Rà soát các nghị quyết của Đảng để lựa chọn, thống nhất mốc thời gian cụ thể” (mục 2, ý 3, điểm 1)
  - id: c5
    topic: Chỉ tiêu R&D, STEM, AI, an ninh mạng
    req: Rà soát cho khớp NQ 217/NQ-CP (06/8/2026)
    now: Có STEM 35% và nhân lực trình độ cao 2,5–3%; không có R&D, AI, an ninh mạng
    status: Một phần
    fix: Đối chiếu NQ 217; bổ sung hoặc dẫn chiếu các chỉ tiêu còn thiếu
    dec: d1
    tb: “Rà soát các chỉ tiêu về nhân lực nghiên cứu, phát triển công nghệ, STEM, trí tuệ nhân tạo và an ninh mạng… phù hợp với Nghị quyết số 217/NQ-CP” (mục 2, ý 3, điểm 2)
  - id: c6
    topic: Lĩnh vực chưa có mục tiêu
    req: Lĩnh vực trọng tâm chưa có mục tiêu nhân lực thì nghiên cứu, đề xuất theo nhu cầu thực tế
    now: Chưa rà soát
    status: Chưa có
    fix: Rà soát chéo danh mục lĩnh vực (c2) với các chỉ tiêu đang có
    dec: d1
    tb: “Đối với các lĩnh vực phát triển trọng tâm nhưng chưa có mục tiêu nhân lực tương ứng, cần nghiên cứu, đề xuất…” (mục 2, ý 3, điểm 3)
  - id: c7
    topic: Kỹ năng sử dụng AI
    req: Đưa kỹ năng sử dụng AI thành kỹ năng nền tảng của người học, người lao động
    now: AI có trong đổi mới chương trình (nhóm IV, mục 1b); chưa là kỹ năng nền tảng, chưa có chỉ tiêu
    status: Một phần
    fix: 'Chọn mức thể hiện: định hướng, nhiệm vụ Phụ lục II hay chỉ tiêu'
    dec: d4
    tb: “Nghiên cứu đưa kỹ năng sử dụng trí tuệ nhân tạo trở thành một trong những kỹ năng nền tảng của người học, người lao động” (mục 2, ý 3, điểm 4)
  - id: c8
    topic: Kinh phí
    req: Nhu cầu kinh phí, cơ cấu nguồn (đầu tư/thường xuyên, TW/ĐP, GD/KHCN, xã hội hóa), phân kỳ theo khả năng cân đối ngân sách
    now: Một đoạn nguyên tắc chung (mục V)
    status: Chưa có
    fix: Xây dựng phần kinh phí; làm việc với Bộ Tài chính
    dec: d5
    tb: “Xác định rõ nhu cầu kinh phí, cơ cấu nguồn vốn… phân kỳ từng giai đoạn phù hợp với khả năng cân đối của ngân sách nhà nước” (mục 2, ý 4)
  - id: c9
    topic: Phụ lục nhiệm vụ
    req: Thời hạn theo tháng/năm; chủ trì, phối hợp, sản phẩm rõ; chỉ giữ nhiệm vụ rõ sản phẩm
    now: 16 nhiệm vụ, thời hạn theo khoảng năm (2026–2030); nhiệm vụ 14–16 chưa nêu tên cơ quan chủ trì
    status: Một phần
    fix: Rút gọn; ghi mốc tháng/năm, sản phẩm và tên bộ chủ trì
    dec: d7
    tb: “Thời hạn hoàn thành (theo tháng, năm); cơ quan chủ trì, cơ quan phối hợp; sản phẩm đầu ra; … chỉ đưa vào phụ lục những nhiệm vụ rõ sản phẩm” (mục 2, ý 5)
  - id: c10
    topic: Dữ liệu và dự báo
    req: Thống nhất phân công Bộ GD&ĐT, Bộ Nội vụ, Bộ Tài chính về dữ liệu và hệ thống dự báo
    now: '4 đầu mối: GD&ĐT (nền tảng dữ liệu), Công an (tài khoản học tập), Tài chính (dự báo), Nội vụ (dữ liệu lao động)'
    status: Cần quyết định
    fix: Chốt quan điểm của Bộ trước khi làm việc với hai bộ
    dec: d6
    tb: “Thống nhất phân công giữa Bộ Giáo dục và Đào tạo, Bộ Nội vụ và Bộ Tài chính trong quản lý, kết nối dữ liệu và xây dựng, vận hành hệ thống dự báo nguồn nhân lực” (mục 2, ý 5)
  - id: c11
    topic: Khung chính sách chung (mục I)
    req: Khung chính sách chung, quy định mở cho các ngành; tránh ban hành chính sách riêng, trùng lặp
    now: Có điều phối và thử nghiệm chính sách; chưa định vị Chiến lược là khung chung
    status: Một phần
    fix: Xác định Chiến lược có chứa khung chính sách chung hay không
    dec: d8
    tb: “Hình thành khung chính sách chung áp dụng cho các ngành, lĩnh vực, quy định theo hướng mở… tránh ban hành chính sách riêng, trùng lặp” (mục 1b)
  - id: c12
    topic: Tích hợp, không trùng lặp (mục I)
    req: Tích hợp nhiệm vụ tương đồng; không trùng mục tiêu, sản phẩm, kinh phí giữa các đề án
    now: Đề xuất lập mới Ban Chỉ đạo quốc gia về PTNNL; chưa đối chiếu với các đề án khác
    status: Cần quyết định
    fix: Cân nhắc Ban Chỉ đạo; lập bảng ranh giới với các đề án trong chuỗi
    dec: d8
    tb: “Thống nhất nguyên tắc sắp xếp, tích hợp những nhiệm vụ có nội dung tương đồng… bảo đảm không trùng lặp mục tiêu, sản phẩm và kinh phí” (mục 1a)
